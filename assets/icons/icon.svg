<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#0b0f19" stroke="url(#cyberGrad)" stroke-width="3.5" />
  
  <!-- Inner Subtle Grid Lines -->
  <path d="M24 64 H104 M64 24 V104" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="64" cy="64" r="32" stroke="#1e293b" stroke-width="1.5" fill="none" />

  <!-- Central Command Symbol: Hexagonal AI Core -->
  <polygon points="64,28 92,44 92,76 64,92 36,76 36,44" fill="#131b2e" stroke="url(#cyberGrad)" stroke-width="2.5" />
  
  <!-- Lightning / Neural Vector Accent -->
  <path d="M64 38 L54 62 H68 L60 84 L76 58 H62 Z" fill="url(#cyberGrad)" filter="url(#neonGlow)"/>
  
  <!-- Orbital Connection Dots -->
  <circle cx="36" cy="44" r="3" fill="#38bdf8" />
  <circle cx="92" cy="44" r="3" fill="#8b5cf6" />
  <circle cx="92" cy="76" r="3" fill="#ec4899" />
  <circle cx="36" cy="76" r="3" fill="#10b981" />
  <circle cx="64" cy="28" r="3" fill="#6366f1" />
  <circle cx="64" cy="92" r="3" fill="#f59e0b" />
</svg>
